<div>
  @if (showHeader()) {
    <div class="pt-14">
      <app-header></app-header>
    </div>
  }

  <hlm-toaster
    [theme]="theme.theme()"
    position="top-center"
    offset="72px"
    visibleToasts="3"
    richColors
    closeButton
    expand
  />
  <!-- O respiro de rodapé só existe nas telas com header: em tela cheia
       (partida) ele somaria 20px a uma altura de 100dvh e criaria scroll. -->
  <main [class.pb-5]="showHeader()">
    <router-outlet></router-outlet>
  </main>

  <!-- @if (showHeader()) {
    <app-footer></app-footer>
  } -->
</div>
