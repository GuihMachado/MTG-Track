<div>
  @if (showHeader()) {
    <!-- O respiro de 3.5rem existe porque o header é fixo. Na home ele não
         existe: a arte do commander nasce em y=0 e corre por baixo do header,
         que ali não tem barra. -->
    <div [class.pt-14]="!overArt()">
      <app-header [overArt]="overArt()" />
    </div>
  }

  <hlm-toaster
    [theme]="theme.theme()"
    position="top-center"
    offset="72px"
    visibleToasts="3"
    richColors
    closeButton
    expand
  />
  <!-- O respiro de rodapé só existe nas telas com header: em tela cheia
       (partida) ele somaria 20px a uma altura de 100dvh e criaria scroll. -->
  <main [class.pb-5]="showHeader()">
    <router-outlet></router-outlet>
  </main>

  <!-- @if (showHeader()) {
    <app-footer></app-footer>
  } -->
</div>
