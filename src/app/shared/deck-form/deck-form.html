<div class="flex flex-col gap-4">
  <div>
    <label class="label-caps block" [attr.for]="idPrefix() + '-name'">Nome do deck</label>
    <div class="well mt-2">
      <input class="well-input" type="text" autocomplete="off" maxlength="160"
             [id]="idPrefix() + '-name'" [value]="value().name"
             [attr.placeholder]="namePlaceholder()"
             (input)="setName($any($event.target).value)" />
    </div>
    @if (!value().name && value().commanderName) {
      <p class="hint">Sem nome, o deck usa o nome do commander.</p>
    }
  </div>

  <div>
    <span class="label-caps block">Commander</span>
    <app-card-picker class="mt-2 block" [control]="commanderControl"
                     placeholder="Buscar commander na Scryfall"
                     (selected)="onCommander($event)" />
  </div>

  <div>
    <span class="label-caps block" [id]="idPrefix() + '-colors'">Cores</span>
    <!-- Orbes de mana: acesa é luz, apagada é placa fria. -->
    <div class="mt-2 flex gap-2" role="group" [attr.aria-labelledby]="idPrefix() + '-colors'">
      @for (orb of orbs; track orb.code) {
        <button type="button" class="orb"
                [class.on]="isOn(orb.code)"
                [style.--mana-rgb]="orb.rgb"
                [attr.aria-label]="orb.label"
                [attr.aria-pressed]="isOn(orb.code)"
                (click)="toggle(orb.code)"
                [innerHTML]="'{' + orb.code + '}' | manaSymbol">
        </button>
      }
    </div>
    <p class="hint">{{ colorHint() }}</p>
  </div>
</div>
