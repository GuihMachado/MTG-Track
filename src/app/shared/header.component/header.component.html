<!-- Sem barra sólida: sobre a arte da home o header desaparece; nas demais
     telas fica um vidro fino, só para o conteúdo não passar por baixo ilegível. -->
<header class="bar" [class.solid]="!overArt()">
    <div class="container-page flex h-full items-center justify-between">
        <button id="edit-profile" type="button" class="icon-btn"
                (click)="menu_sheet.open()" aria-label="Abrir menu">
            <ng-icon hlm size="sm" name="lucideMenu" />
        </button>

        <!-- O avatar é o acesso ao perfil: dropdown com perfil e tema. -->
        <button type="button" class="avatar-btn" [hlmDropdownMenuTrigger]="profileMenu"
                align="end" aria-label="Abrir menu do perfil">
            @if (profile.avatar(); as avatar) {
                <img class="avatar-img" [src]="avatar" alt="" />
            } @else if (profile.initial(); as initial) {
                <span class="avatar-initial">{{ initial }}</span>
            } @else {
                <ng-icon hlm size="sm" name="lucideUser" />
            }
        </button>
    </div>
</header>

<ng-template #profileMenu>
    <div hlmDropdownMenu class="w-56">
        <div class="flex items-center gap-3 px-2 py-2">
            @if (profile.avatar(); as avatar) {
                <img class="size-9 rounded-full object-cover" [src]="avatar" alt="" />
            } @else {
                <span class="avatar-initial size-9">{{ profile.initial() || '?' }}</span>
            }
            <span class="min-w-0">
                <span class="block truncate text-sm font-semibold">{{ profile.profile()?.name }}</span>
                <span class="label-caps">Sua conta</span>
            </span>
        </div>

        <hlm-dropdown-menu-separator />

        <button hlmDropdownMenuItem (click)="goToProfile()">
            <ng-icon hlm size="sm" name="lucideUserCog" />
            Meu Perfil
        </button>

        <button hlmDropdownMenuItem (click)="theme.toggle()">
            <ng-icon hlm size="sm" [name]="theme.theme() === 'dark' ? 'lucideSun' : 'lucideMoon'" />
            {{ theme.theme() === 'dark' ? 'Modo Light' : 'Modo Dark' }}
        </button>
    </div>
</ng-template>

<hlm-sheet side="left" #menu_sheet>
    <hlm-sheet-content *brnSheetContent="let ctx">
        <hlm-sheet-header class="pb-0">
            <h3 hlmSheetTitle class="title-section">Menu</h3>
            <p hlmSheetDescription class="text-sm">Selecione para onde quer ir.</p>
            <hlm-separator class="my-4" />
        </hlm-sheet-header>
        <!-- Cada link fecha o sheet: sem isso a navegação acontece por baixo do
             overlay e o menu fica aberto na tela nova. O item ativo ganha placa,
             não só cor de texto. -->
        <nav class="menu-glow grid flex-1 auto-rows-min gap-2 px-3">
            @for (item of navItems; track item.route) {
                <a class="nav-item" [routerLink]="[item.route]" (click)="ctx.close()"
                   routerLinkActive="active">
                    <ng-icon hlm size="sm" [name]="item.icon" />
                    <span>{{ item.label }}</span>
                </a>
            }
        </nav>
    </hlm-sheet-content>
</hlm-sheet>
