<div class="relative h-36 w-full flex justify-center items-center">
  <canvas baseChart
    [data]="doughnutChartData"
    [options]="doughnutChartOptions"
    [type]="doughnutChartType">
  </canvas>

  <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
    <span class="text-3xl font-data font-bold">{{ winRate }}%</span>
    <span class="text-xs text-foreground-muted">Win Rate</span>
  </div>
</div>
