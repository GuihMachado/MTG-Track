<!-- Voltar é uma placa de 38px, não um fantasma: nas telas de fluxo ele é o
     único ponto de saída, e placa é o que o sistema usa para "objeto tocável". -->
<button
  type="button"
  class="plate-btn"
  [attr.aria-label]="label()"
  [title]="label()"
  (click)="goBack()">
  <ng-icon hlm size="sm" name="lucideChevronLeft" />
</button>
