<div class="w-screen h-screen bg-background-deep overflow-hidden flex items-center justify-center">
  <div class="w-full max-w-[min(100vw,100vh)] p-2">
    <app-life-wheel
      [players]="players()"
      (lifeChange)="onLifeChange($event)"
      (menu)="menu_sheet.open()" />
  </div>
</div>

<hlm-sheet side="bottom" #menu_sheet>
  <hlm-sheet-content *brnSheetContent="let ctx">
    <hlm-sheet-header>
      <h3 hlmSheetTitle class="font-display text-h3">Partida</h3>
      <p hlmSheetDescription>Cores dos assentos e controles da mesa.</p>
      <hlm-separator class="my-2" />
    </hlm-sheet-header>

    <div class="grid gap-3 px-4 pb-4">
      @for (player of players(); track player.id) {
        <div class="flex items-center justify-between gap-4">
          <span class="text-sm font-medium">{{ player.name }}</span>
          <button hlmBtn variant="outline" size="sm" type="button"
                  (click)="cycleSeatColor(player.id)"
                  [attr.aria-label]="'Trocar cor de ' + player.name + ': ' + seatColors[player.seatColor].label">
            <span class="inline-block w-4 h-4 rounded-full border border-border"
                  [style.background]="'var(' + seatColors[player.seatColor].cssVarName + ')'"></span>
            <span class="font-data text-xs">{{ player.seatColor }}</span>
          </button>
        </div>
      }

      <hlm-separator class="my-1" />

      <button hlmBtn variant="secondary" type="button" (click)="resetLives()">
        Reiniciar vidas
      </button>

      <button hlmBtn variant="ghost" type="button" (click)="confirmLeave()"
              class="text-danger hover:bg-danger-bg hover:text-danger">
        Sair da partida
      </button>
    </div>
  </hlm-sheet-content>
</hlm-sheet>
