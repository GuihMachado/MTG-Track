<div class="container-page flex flex-col">
  <h2 class="my-3 text-h2 font-semibold">Partidas</h2>

  @if (loading()) {
    <div class="flex flex-col gap-2">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <hlm-skeleton class="h-16 w-full" />
      }
    </div>
  } @else if (matches().length === 0) {
    <hlm-empty class="border border-border rounded-lg py-10">
      <hlm-empty-header>
        <h3 hlmEmptyTitle>Nenhuma partida ainda</h3>
        <p hlmEmptyDescription class="text-foreground-muted">Que tal começar uma?</p>
      </hlm-empty-header>
      <hlm-empty-content>
        <a hlmBtn routerLink="/play">Nova partida</a>
      </hlm-empty-content>
    </hlm-empty>
  } @else {
    <div class="flex flex-col">
      @for (match of matches(); track match.id) {
        <app-match-card [match]="match" [currentUserId]="currentUserId()" (finished)="loadMatches()" />
      }
    </div>
  }
</div>
