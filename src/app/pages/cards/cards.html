<div class="container-page pt-4">
    <div class="flex items-center gap-2">
        <app-back-button />
        <h1 class="title-screen">Buscar carta</h1>
    </div>
    <p class="ml-[3.125rem] pt-1 text-sm text-foreground-muted">Nome em português quando existe; texto traduzido quando não.</p>

    <hlm-separator class="my-4" />

    <div hlmInputGroup class="w-full">
        <input hlmInputGroupInput [formControl]="search" placeholder="Digite o nome do card..." />
        <div hlmInputGroupAddon>
            <ng-icon hlm size="sm" name="lucideSearch" />
        </div>
    </div>

    @if (card$ | async; as card) {
        <div class="mx-auto mt-6 w-full max-w-sm overflow-hidden rounded-(--radius-card-art) shadow-[0_18px_30px_-18px_rgba(0,0,0,.95)]">
            <img src="{{ card.imageUrl }}" alt="{{ card.name }}" class="w-full" />
        </div>
        <div class="plate mx-auto mt-6 flex max-w-[60ch] flex-col items-center rounded-lg">
            <p class="whitespace-pre-wrap p-4 text-body-lg" [innerHTML]="(card.descriptionTranslated ?? card.description) | manaSymbol"></p>
        </div>
    }
</div>
