<div class="container-page">
    <div class="flex items-center gap-2">
        <app-back-button />
        <h1 class="text-h1 font-display">Nova Partida</h1>
    </div>
    <p class="ml-11 text-foreground-muted pt-1">Inicie uma nova partida!</p>

    <hlm-separator class="my-4" />

    <form [formGroup]="gameForm" (ngSubmit)="onSubmit()" class="max-w-2xl mx-auto">
        <h2 class="text-h3 font-semibold mb-3">Jogadores</h2>

        <div formArrayName="players" class="space-y-4">
            @for (player of playersArray.controls; track player; let i = $index) {
                <div [formGroupName]="i" hlmCard class="p-4 gap-3 relative">

                    @if (playersArray.length > 1) {
                        <button type="button"
                            (click)="removePlayer(i)"
                            aria-label="Remover jogador"
                            class="absolute top-2 right-2 w-8 h-8 flex items-center justify-center rounded-md text-foreground-subtle hover:text-danger hover:bg-danger-bg transition-colors">
                            ✕
                        </button>
                    }

                    <h3 class="text-label uppercase tracking-wider font-semibold text-foreground-subtle">Jogador {{ i + 1 }}</h3>

                    <div class="flex flex-wrap gap-2">
                        <div>
                            <label class="block text-sm font-medium" hlmLabel>Nome</label>

                            <brn-select class="inline-block" placeholder="" formControlName="userId">
                                <hlm-select-trigger class="w-36 mt-1">
                                    <hlm-select-value />
                                </hlm-select-trigger>
                                <hlm-select-content>
                                    @for (user of usersList; track $index) {
                                        <hlm-option [value]="user.id">{{ user.name }}</hlm-option>
                                    }
                                </hlm-select-content>
                            </brn-select>
                        </div>

                        <div class="flex-1 min-w-40">
                            <label class="block text-sm font-medium" hlmLabel>Commander</label>
                            <input type="text" formControlName="commander" hlmInput class="w-full mt-1">
                        </div>
                    </div>

                    <div class="mt-3 flex">
                        <label class="block text-sm font-medium mr-4 self-center" hlmLabel>Cores:</label>
                        <div class="flex gap-2">
                            @for (color of manaColors; track color.code) {
                                <button type="button"
                                        (click)="toggleColor(i, color.code)"
                                        [attr.aria-label]="color.label"
                                        [attr.aria-pressed]="isColorSelected(i, color.code)"
                                        [class.opacity-40]="!isColorSelected(i, color.code)"
                                        [class.ring-2]="isColorSelected(i, color.code)"
                                        [class.ring-offset-1]="isColorSelected(i, color.code)"
                                        class="w-8 h-8 rounded-full border border-border bg-surface-2 ring-ring ring-offset-background flex items-center justify-center transition-all"
                                        [innerHTML]="'{' + color.code + '}' | manaSymbol">
                                </button>
                            }
                        </div>
                    </div>
                </div>
            }
        </div>

        <button type="button" hlmBtn variant="outline"
                (click)="addPlayer()"
                class="w-full mt-4 border-dashed">
            <span class="text-xl font-bold">+</span> Adicionar Jogador
        </button>

        <div class="mt-6 flex justify-end">
            <button type="submit" hlmBtn
                    [disabled]="loading"
                    class="w-full">
                {{ loading ? 'Iniciando...' : 'Iniciar Partida!' }}
            </button>
        </div>

    </form>
</div>
