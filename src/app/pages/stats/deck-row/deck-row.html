<button type="button" class="row" [class.retired]="deck().retired"
        [style.--deck-rgb]="rgb()" (click)="open.emit()" [attr.aria-label]="ariaLabel()">
  <!-- Arte 50×62; erro de imagem cai para a placa neutra, nunca deixa buraco. -->
  @if (artUrl() && !artFailed()) {
    <img class="art" [src]="artUrl()" alt="" loading="lazy" (error)="artFailed.set(true)" />
  } @else {
    <span class="art art-fallback" aria-hidden="true"></span>
  }

  <span class="min-w-0 flex-1 flex flex-col gap-2">
    <span class="flex items-center gap-2">
      <span class="name min-w-0 flex-1 truncate">{{ deck().commander }}</span>
      @if (symbols()) {
        <span class="pips flex flex-none gap-0.5 text-[12px]"
              [innerHTML]="symbols() | manaSymbol"></span>
      }
    </span>

    <!-- Barra por faixa: verde ≥50, âmbar 35–49, vermelho <35. -->
    <span class="flex items-center gap-2" role="progressbar"
          [attr.aria-valuenow]="deck().winRate" aria-valuemin="0" aria-valuemax="100"
          [attr.aria-label]="ariaLabel()">
      <span class="track flex-1">
        <span class="fill" [class.glow]="glow()"
              [style.width.%]="deck().winRate"
              [style.background]="'var(--' + band().color + ')'"></span>
      </span>
      <span class="rate" [style.color]="'var(--' + band().color + ')'">{{ deck().winRate }}%</span>
    </span>

    <span class="context flex items-center gap-1.5">
      <span><b class="text-success">{{ deck().wins }}</b>V</span>
      <span class="dot" aria-hidden="true"></span>
      <span><b class="text-danger">{{ deck().losses }}</b>D</span>
      <span class="dot" aria-hidden="true"></span>
      <span>{{ deck().total }} partida{{ deck().total > 1 ? 's' : '' }}</span>
      <span class="dot" aria-hidden="true"></span>
      @if (deck().smallSample) {
        <span class="short-sample">amostra curta</span>
      } @else {
        <span>{{ deck().lastPlayed | timeAgo | lowercase }}</span>
      }
    </span>
  </span>
</button>
