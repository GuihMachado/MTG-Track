<button type="button" class="row" (click)="edit.emit(entry())"
        [attr.aria-label]="'Editar ' + entry().name + ', ' + copies()">
  @if (entry().imageUrl ?? entry().artCropUrl; as image) {
    <!-- A carta inteira quando o dado existe; linha antiga cai na arte até o
         refresh de preços preencher a imagem. -->
    <img class="thumb" [src]="image" alt="" loading="lazy" decoding="async" />
  } @else {
    <!-- Imagem que não carrega cai na placa neutra; nunca deixa buraco. -->
    <span class="thumb thumb-empty" aria-hidden="true"></span>
  }

  <span class="min-w-0 flex-1 text-left">
    <span class="block truncate text-[14.5px] font-semibold">{{ entry().name }}</span>

    <span class="mt-[5px] flex items-center gap-1.5">
      <span class="font-data text-[10px] tracking-[0.06em] text-foreground-subtle">
        {{ entry().setCode }}
      </span>
      <span class="dot" aria-hidden="true"></span>
      <span class="font-data text-[10px] text-foreground-subtle">{{ language() }}</span>

      @if (entry().foil) {
        <span class="foil-chip" aria-label="foil">
          <ng-icon hlm name="lucideSparkles" class="!size-[9px]" />
          FOIL
        </span>
      }
    </span>
  </span>

  <span class="flex flex-none flex-col items-end gap-[5px]">
    <span class="qty-badge" [class.plenty]="plenty()"
          [attr.aria-label]="copies()">
      ×{{ entry().quantity }}
    </span>

    <span class="font-data text-[11.5px]"
          [class.text-foreground-muted]="!expensive()"
          [class.text-price-strong]="expensive()">
      @if (entry().priceUsd !== null) {
        {{ price() }}
      } @else {
        <!-- Preço indisponível é um travessão, nunca US$ 0. -->
        <span class="text-faint">—</span>
      }
    </span>
  </span>
</button>
