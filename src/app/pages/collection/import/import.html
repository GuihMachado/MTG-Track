@if (resolutions(); as resolved) {
  <app-import-review [resolutions]="resolved" [destination]="destination()"
                     [deckName]="deckName()" [deckId]="deckId()"
                     (back)="backToList()" (imported)="onImported($event)" />
} @else {
  <div class="page">
    <div class="halo" aria-hidden="true"></div>

    <div class="container-page relative pb-32 pt-3">
      <header class="flex items-center gap-3">
        <app-back-button [fallbackRoute]="deckId() ? '/decks/' + deckId() : '/colecao'" />
        <h1 class="flex-1 text-[22px] font-semibold tracking-[-0.01em]">
          {{ deckId() ? 'Adicionar lista' : 'Importar' }}
        </h1>
      </header>

      @if (deckId()) {
        <p class="mt-3 text-[13px] leading-snug text-foreground-muted text-pretty">
          A lista entra no deck e mostra o que você já tem na coleção. Nome,
          commander e cores do deck não mudam.
        </p>
      } @else {
        <!-- Destino: a primeira escolha, e a que evita a pior falha da feature. -->
        <section class="mt-4">
          <span class="label-caps">Para onde vai</span>

          <div class="segmented mt-2">
            <button type="button" class="segmented-tab" [class.on]="destination() === 'deck'"
                    (click)="setDestination('deck')">
              <ng-icon hlm name="lucideLayers" class="!size-4" />
              Novo deck
            </button>
            <button type="button" class="segmented-tab" [class.on]="destination() === 'collection'"
                    (click)="setDestination('collection')">
              <ng-icon hlm name="lucideLibraryBig" class="!size-4" />
              Somar à coleção
            </button>
          </div>

          <p class="mt-2 text-[12px] text-faint">{{ destinationHint() }}</p>
        </section>
      }

      <app-list-source class="mt-4" [(text)]="text" (fetchedName)="deckName.set($event)" />
    </div>

    <button type="button" class="cta-pill" (click)="read()" [disabled]="!canRead()">
      {{ reading() ? 'Lendo…' : 'Ler a lista' }}
      @if (!reading()) {
        <ng-icon hlm name="lucideArrowRight" class="!size-[18px]" />
      }
    </button>
  </div>
}
